<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>DOM Debug – Lesson 2 (Bugs)</title>
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <main class="container">
      <h1 id="titel">Preisrechner (mit Bugs) 🐞</h1>
      <p id="beschreibung">Finden Sie die Fehler mit dem Debugger.</p>
      
      <form id="calc-form">
        <label>Netto-Preis (€)
          <input id="price" type="number" min="0" step="0.01" value="19.99" />
        </label>
        <label>Menge
          <input id="qty" type="number" min="1" step="1" value="2" />
        </label>
        <label>Rabatt (%) 
          <input id="discount" type="number" min="0" max="90" step="1" value="5" />
        </label>
        <!-- BUG: Button-ID ist falsch; JS sucht nach 'calc-btn' -->
        <button id="calcButton" type="submit">Berechnen</button>
      </form>

      <!-- BUG: result ist initial versteckt durch CSS .hidden -->
      <section id="result" class="hidden" aria-live="polite">
        <p>Brutto (inkl. 20% USt): <strong id="brutto">—</strong></p>
        <p>Gesamtbetrag: <strong id="total">—</strong></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
