<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>DOM Debug – Lesson 1 (Clean)</title>
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <main class="container">
      <h1 id="titel">Preisrechner 📈</h1>
      <p id="beschreibung">Geben Sie Netto-Preis, Menge und Rabatt ein. JavaScript berechnet Brutto und Gesamt.</p>
      
      <form id="calc-form">
        <label>Netto-Preis (€)
          <input id="price" type="number" min="0" step="0.01" value="19.99" />
        </label>
        <label>Menge
          <input id="qty" type="number" min="1" step="1" value="2" />
        </label>
        <label>Rabatt (%) 
          <input id="discount" type="number" min="0" max="90" step="1" value="5" />
        </label>
        <button id="calc-btn" type="submit">Berechnen</button>
      </form>

      <section id="result" aria-live="polite">
        <p>Brutto (inkl. 20% USt): <strong id="brutto">—</strong></p>
        <p>Gesamtbetrag: <strong id="total">—</strong></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
